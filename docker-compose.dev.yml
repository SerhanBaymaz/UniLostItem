name: unilostitem-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-unilostitem-dev
    env_file:
      - dev.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: seq-unilostitem-dev
    env_file:
      - dev.env
    ports:
      - "5348:5341"
      - "8088:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: unilostitem-api:dev
    container_name: api-unilostitem-dev
    env_file:
      - dev.env
    ports:
      - "8089:8089"
      - "5009:5009"  # Debug port (optional)
    volumes:
      # Mount source code for hot reload
      - ./API:/src/API
      - ./Application:/src/Application
      - ./Domain:/src/Domain
      - ./Persistence:/src/Persistence
      # Prevent overwriting of obj and bin folders
      - /src/API/obj
      - /src/API/bin
      - /src/Application/obj
      - /src/Application/bin
      - /src/Domain/obj
      - /src/Domain/bin
      - /src/Persistence/obj
      - /src/Persistence/bin
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  postgres-data:
    driver: local
  seq-data:
    driver: local
