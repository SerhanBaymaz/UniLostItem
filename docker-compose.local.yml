name: uni-lost-item-local
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-uni-lost-item-local
    env_file:
      - dev.env
    ports:
      - "5499:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: seq-uni-lost-item-local
    env_file:
      - dev.env
    ports:
      - "5399:5341"
      - "8099:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  seq-data:
    driver: local
