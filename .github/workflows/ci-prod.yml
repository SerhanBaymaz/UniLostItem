name: CI-Prod Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-test-analyze:
    name: Build & Test (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Unilostitem.sln

      - name: Build solution
        run: dotnet build Unilostitem.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test Unilostitem.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Move coverage files
        run: |
          find ./coverage -name "coverage.opencover.xml" -exec cp {} ./Tests/ \;

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-prod
          path: ./coverage/**/coverage.opencover.xml
          retention-days: 90

      - name: Coverage Summary
        run: |
          if [ -f ./Tests/coverage.opencover.xml ]; then
            echo "✅ Coverage report generated successfully"
            echo "📊 Coverage file: ./Tests/coverage.opencover.xml"
          else
            echo "⚠️ Coverage report not found"
          fi

  docker-build-prod:
    name: Docker Production Build
    runs-on: ubuntu-latest
    needs: build-test-analyze

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker production image
        run: |
          docker build -f Dockerfile.prod -t templatedeneme:prod .

      - name: Verify Docker image
        run: |
          docker images | grep templatedeneme

      - name: Test Docker container
        run: |
          docker run --rm -d --name test-container -p 8080:8080 templatedeneme:prod
          sleep 5
          docker ps | grep test-container || exit 1
          docker stop test-container

      - name: Docker Build Success Message
        run: echo "✅ Docker production image built and tested successfully"
