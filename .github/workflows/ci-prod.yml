name: CI-Prod Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-test-analyze:
    name: Build & Test (Production)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore CqrsCleanLayerDotNET9Template.sln

      - name: Build solution
        run: dotnet build CqrsCleanLayerDotNET9Template.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test CqrsCleanLayerDotNET9Template.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Move coverage files
        run: |
          find ./coverage -name "coverage.opencover.xml" -exec cp {} ./Tests/ \;

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-prod
          path: ./coverage/**/coverage.opencover.xml
          retention-days: 90

      - name: Coverage Summary
        run: |
          if [ -f ./Tests/coverage.opencover.xml ]; then
            echo "✅ Coverage report generated successfully"
            echo "📊 Coverage file: ./Tests/coverage.opencover.xml"
          else
            echo "⚠️ Coverage report not found"
          fi

  docker-build-prod:
    name: Docker Production Build
    runs-on: ubuntu-latest
    needs: build-test-analyze
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set lowercase repository owner
        id: repo-owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker production image
        run: |
          docker build -f Dockerfile.prod \
            -t ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:latest \
            -t ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:sha-${{ steps.git-sha.outputs.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker images | grep prod-cqrs-clean-net9
          echo "📦 Built tags:"
          echo "  - ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:latest"
          echo "  - ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:sha-${{ steps.git-sha.outputs.sha }}"

      - name: Test Docker container
        env:
          JWT_SECRET_KEY_PROD: ${{ secrets.JWT_SECRET_KEY_PROD }}
          JWT_ISSUER_PROD: ${{ secrets.JWT_ISSUER_PROD }}
          JWT_AUDIENCE_PROD: ${{ secrets.JWT_AUDIENCE_PROD }}
          JWT_ACCESS_TOKEN_EXPIRATION_MINUTES_PROD: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION_MINUTES_PROD }}
          JWT_REFRESH_TOKEN_EXPIRATION_DAYS_PROD: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_DAYS_PROD }}
        run: |
          docker run --rm -d --name test-container -p 8080:8080 \
            -e Jwt__SecretKey="${JWT_SECRET_KEY_PROD}" \
            -e Jwt__Issuer="${JWT_ISSUER_PROD}" \
            -e Jwt__Audience="${JWT_AUDIENCE_PROD}" \
            -e Jwt__AccessTokenExpirationMinutes="${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES_PROD}" \
            -e Jwt__RefreshTokenExpirationDays="${JWT_REFRESH_TOKEN_EXPIRATION_DAYS_PROD}" \
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:latest

          echo "⏳ Waiting for container to start..."
          sleep 10

          docker ps | grep test-container || exit 1
          echo "✅ Container is running"

          echo ""
          echo "📋 Container logs:"
          docker logs test-container

          echo ""
          echo "🏥 Testing health endpoint..."
          HTTP_STATUS=$(curl -s -o /tmp/health-response.json -w "%{http_code}" http://localhost:8080/health/api)
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/health-response.json | jq '.' || cat /tmp/health-response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check failed with status $HTTP_STATUS"
            docker logs test-container
            docker stop test-container
            exit 1
          fi

          echo "✅ Health check passed"
          docker stop test-container
          echo "✅ Production image test completed"

      - name: Push to GitHub Container Registry
        run: |
          docker push ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:latest
          docker push ghcr.io/${{ steps.repo-owner.outputs.owner }}/prod-cqrs-clean-net9:sha-${{ steps.git-sha.outputs.sha }}
          echo "✅ Images pushed to GitHub Container Registry"
