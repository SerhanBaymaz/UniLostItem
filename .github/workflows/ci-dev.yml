name: CI-Dev Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN_DEV: ${{ secrets.SONAR_TOKEN_DEV }}
  SONAR_PROJECT_KEY_DEV: ${{ secrets.SONAR_PROJECT_KEY_DEV }}
  SONAR_ORGANIZATION_DEV: ${{ secrets.SONAR_ORGANIZATION_DEV }}
  SONAR_HOST_URL_DEV: ${{ secrets.SONAR_HOST_URL_DEV }}

jobs:
  build-test-analyze:
    name: Build, Test & SonarCloud Analysis (Development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (required for SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore Unilostitem.sln

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN_DEV: ${{ env.SONAR_TOKEN_DEV }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY_DEV }}" \
            /o:"${{ env.SONAR_ORGANIZATION_DEV }}" \
            /d:sonar.token="${{ env.SONAR_TOKEN_DEV }}" \
            /d:sonar.host.url="${{ env.SONAR_HOST_URL_DEV }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/obj/**,**/bin/**" \
            /d:sonar.exclusions="**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build solution
        run: dotnet build Unilostitem.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test Unilostitem.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Move coverage files
        run: |
          find ./coverage -name "coverage.opencover.xml" -exec cp {} ./Tests/ \;

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN_DEV: ${{ env.SONAR_TOKEN_DEV }}
        run: |
          dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN_DEV }}"

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/**/coverage.opencover.xml
          retention-days: 30

      - name: Coverage Summary
        run: |
          if [ -f ./Tests/coverage.opencover.xml ]; then
            echo "✅ Coverage report generated successfully"
            echo "📊 Coverage file: ./Tests/coverage.opencover.xml"
          else
            echo "⚠️ Coverage report not found"
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build-test-analyze

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker dev image
        run: |
          docker build -f Dockerfile.dev \
            -t ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:latest \
            -t ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:sha-${{ steps.git-sha.outputs.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker images | grep dev-templatedeneme
          echo "📦 Built tags:"
          echo "  - ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:latest"
          echo "  - ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:sha-${{ steps.git-sha.outputs.sha }}"

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:latest
          docker push ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:sha-${{ steps.git-sha.outputs.sha }}
          echo "✅ Images pushed to GitHub Container Registry"

      - name: Test Docker container
        run: |
          docker run -d --name test-container ghcr.io/${{ github.repository_owner }}/dev-templatedeneme:latest
          sleep 5
          docker ps | grep test-container || exit 1
          docker stop test-container
