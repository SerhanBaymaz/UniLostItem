name: CI-Dev Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "9.0.x"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN_DEV: ${{ secrets.SONAR_TOKEN_DEV }}
  SONAR_PROJECT_KEY_DEV: ${{ secrets.SONAR_PROJECT_KEY_DEV }}
  SONAR_ORGANIZATION_DEV: ${{ secrets.SONAR_ORGANIZATION_DEV }}
  SONAR_HOST_URL_DEV: ${{ secrets.SONAR_HOST_URL_DEV }}

jobs:
  build-test-analyze:
    name: Build, Test & SonarCloud Analysis (Development)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java (required for SonarCloud)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ~/.dotnet/tools
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore CqrsCleanLayerDotNET9Template.sln

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN_DEV: ${{ env.SONAR_TOKEN_DEV }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY_DEV }}" \
            /o:"${{ env.SONAR_ORGANIZATION_DEV }}" \
            /d:sonar.token="${{ env.SONAR_TOKEN_DEV }}" \
            /d:sonar.host.url="${{ env.SONAR_HOST_URL_DEV }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.inclusions="API/**,Application/**,Domain/**,Persistence/**" \
            /d:sonar.coverage.exclusions="**/Persistence/Migrations/**,**/Migrations/**,**/obj/**,**/bin/**,**/Program.cs" \
            /d:sonar.exclusions="**/Persistence/Migrations/**,**/Migrations/**,**/obj/**,**/bin/**"

      - name: Build solution
        run: dotnet build CqrsCleanLayerDotNET9Template.sln --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test CqrsCleanLayerDotNET9Template.sln \
            --no-build \
            --configuration Release \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Move coverage files
        run: |
          find ./coverage -name "coverage.opencover.xml" -exec cp {} ./Tests/ \;

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          SONAR_TOKEN_DEV: ${{ env.SONAR_TOKEN_DEV }}
        run: |
          dotnet sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN_DEV }}"

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/**/coverage.opencover.xml
          retention-days: 30

      - name: Coverage Summary
        run: |
          if [ -f ./Tests/coverage.opencover.xml ]; then
            echo "✅ Coverage report generated successfully"
            echo "📊 Coverage file: ./Tests/coverage.opencover.xml"
          else
            echo "⚠️ Coverage report not found"
          fi

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build-test-analyze
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set lowercase repository owner
        id: repo-owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker dev image
        run: |
          docker build -f Dockerfile.dev \
            -t ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:latest \
            -t ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:sha-${{ steps.git-sha.outputs.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker images | grep dev-cqrs-clean-net9
          echo "📦 Built tags:"
          echo "  - ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:latest"
          echo "  - ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:sha-${{ steps.git-sha.outputs.sha }}"

      - name: Test Docker container
        env:
          JWT_SECRET_KEY_DEV: ${{ secrets.JWT_SECRET_KEY_DEV }}
          JWT_ISSUER_DEV: ${{ secrets.JWT_ISSUER_DEV }}
          JWT_AUDIENCE_DEV: ${{ secrets.JWT_AUDIENCE_DEV }}
          JWT_ACCESS_TOKEN_EXPIRATION_MINUTES_DEV: ${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION_MINUTES_DEV }}
          JWT_REFRESH_TOKEN_EXPIRATION_DAYS_DEV: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_DAYS_DEV }}
        run: |
          docker run --rm -d --name test-container -p 8089:8089 \
            -e Jwt__SecretKey="${JWT_SECRET_KEY_DEV}" \
            -e Jwt__Issuer="${JWT_ISSUER_DEV}" \
            -e Jwt__Audience="${JWT_AUDIENCE_DEV}" \
            -e Jwt__AccessTokenExpirationMinutes="${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES_DEV}" \
            -e Jwt__RefreshTokenExpirationDays="${JWT_REFRESH_TOKEN_EXPIRATION_DAYS_DEV}" \
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:latest

          echo "⏳ Waiting for container to build and start..."
          echo "📦 Dev container uses 'dotnet watch' which needs time to build..."
          sleep 20

          docker ps | grep test-container || exit 1
          echo "✅ Container is running"

          echo ""
          echo "📋 Container logs:"
          docker logs test-container

          echo ""
          echo "🏥 Testing health endpoint (with retries)..."

          # Retry logic for health check (max 6 attempts, 10 seconds apart = 1 minute total)
          max_attempts=6
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts..."
            HTTP_STATUS=$(curl -s -o /tmp/health-response.json -w "%{http_code}" http://localhost:8089/health/api || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed!"
              echo "HTTP Status: $HTTP_STATUS"
              echo "Response:"
              cat /tmp/health-response.json | jq '.' || cat /tmp/health-response.json
              break
            else
              echo "⚠️ Health check returned status: $HTTP_STATUS"

              if [ $attempt -eq $max_attempts ]; then
                echo "❌ Health check failed after $max_attempts attempts"
                echo "📋 Final container logs:"
                docker logs test-container
                docker stop test-container
                exit 1
              fi

              echo "⏳ Waiting 10 seconds before retry..."
              sleep 10
              attempt=$((attempt + 1))
            fi
          done
          docker stop test-container
          echo "✅ Development image test completed"

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:latest
          docker push ghcr.io/${{ steps.repo-owner.outputs.owner }}/dev-cqrs-clean-net9:sha-${{ steps.git-sha.outputs.sha }}
          echo "✅ Images pushed to GitHub Container Registry"
