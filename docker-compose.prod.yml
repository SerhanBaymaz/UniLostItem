name: cqrs-clean-net9-prod
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-cqrs-clean-net9-prod
    env_file:
      - prod.env
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: seq-cqrs-clean-net9-prod
    env_file:
      - prod.env
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: cqrs-clean-net9-api:prod
    container_name: api-cqrs-clean-net9-prod
    env_file:
      - prod.env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
  seq-data:
    driver: local
